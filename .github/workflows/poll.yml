name: poll

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      STATE_BRANCH: state
      STATE_DIR: state-branch
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Checkout state branch (or init)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATE_BRANCH" || true
          mkdir -p "$STATE_DIR"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null 2>&1; then
            git --work-tree="$STATE_DIR" checkout "origin/$STATE_BRANCH" -- state.json || true
          fi

      - name: Run watcher
        run: python -m src.main --state "$STATE_DIR/state.json"

      - name: Commit state to state branch
        run: |
          set -euo pipefail
          if [ ! -f "$STATE_DIR/state.json" ]; then
            echo "no state.json produced; skipping commit"
            exit 0
          fi
          # Build a single-file orphan commit and push it as the new tip of `state`.
          tmp=$(mktemp -d)
          cp "$STATE_DIR/state.json" "$tmp/state.json"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan "$STATE_BRANCH"
          git add state.json
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin "$STATE_BRANCH"
